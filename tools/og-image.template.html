<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0a1a10;color:#fafbf7;overflow:hidden;
 font-family:'Pretendard Variable',Pretendard,'WenQuanYi Zen Hei',sans-serif;position:relative}
.glow{position:absolute;right:-160px;top:-160px;width:680px;height:680px;border-radius:50%;
 background:radial-gradient(circle,rgba(201,242,125,.22),transparent 62%)}
.ring{position:absolute;border:1px solid rgba(201,242,125,.16);border-radius:50%}
.r1{width:620px;height:620px;right:-180px;bottom:-260px}
.r2{width:420px;height:420px;right:-80px;bottom:-160px}
.wrap{position:relative;z-index:2;padding:56px 76px 52px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:14px}
.dot{width:34px;height:34px;border-radius:50%;background:#c9f27d;color:#0f4a26;display:grid;place-items:center;font-weight:800;font-size:14px}
.brand{font-size:17px;font-weight:700;letter-spacing:.02em}
.kicker{margin-left:auto;font-size:14px;letter-spacing:.22em;color:rgba(250,251,247,.5);text-transform:uppercase}
h1{font-size:78px;line-height:1.02;letter-spacing:-.045em;font-weight:800}
h1 .yr{color:#2fb855;font-weight:700}
h1 em{font-style:normal;color:#c9f27d}
.sub{margin-top:22px;font-size:23px;color:rgba(250,251,247,.72);letter-spacing:-.01em}
.bot{display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid rgba(250,251,247,.13);padding-top:24px}
.meta{display:flex;gap:52px}
.mt{font-size:12px;letter-spacing:.2em;color:rgba(250,251,247,.42);text-transform:uppercase;margin-bottom:8px}
.mv{font-size:18px;font-weight:600}
.mv .lime{color:#c9f27d}
</style></head><body>
<div class="glow"></div><div class="ring r1"></div><div class="ring r2"></div>
<div class="wrap">
  <div class="top"><div class="dot">KS</div><div class="brand">KSM AWARDS 2026</div>
    <div class="kicker">Korea Sustainability Awards</div></div>
  <div>
    <h1><span class="yr">2026</span> 대한민국<br><em>지속가능경영</em> 대상</h1>
    <div class="sub">내일의 가치를 오늘 증명하는 대한민국 지속가능경영의 리더들을 기립니다.</div>
  </div>
  <div class="bot">
    <div class="meta">
      <div><div class="mt">Application Deadline</div><div class="mv">2026. 09. 28 (월)</div></div>
      <div><div class="mt">Ceremony</div><div class="mv"><span class="lime">2026. 11. 06 (금)</span></div></div>
      <div><div class="mt">Venue</div><div class="mv">건국대학교 경영관</div></div>
    </div>
  </div>
</div></body></html>
